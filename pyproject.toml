[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rm2-pen"
version = "0.1.0"
description = "Use a reMarkable 2 as a pen tablet on Linux over SSH"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["evdev"]

[project.scripts]
rm2-pen = "rm2_pen.__main__:main"

[tool.setuptools.packages.find]
include = ["rm2_pen*"]
