[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rm2-pen"
version = "0.1.0"
description = "Virtual Wayland pen tablet demos for a reMarkable desktop bridge"
requires-python = ">=3.11"
dependencies = ["evdev"]

[project.scripts]
rm2-pen = "rm2_pen.__main__:main"

[tool.setuptools.packages.find]
include = ["rm2_pen*"]
